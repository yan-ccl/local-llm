name: local-llm

services:
  ollama:
    image: ollama/ollama:latest
    container_name: local-llm-ollama
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  ollama-init:
    image: ollama/ollama:latest
    container_name: local-llm-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: 'echo "Pulling ${LLM_MODEL:-qwen2.5:3b} ..." && ollama pull ${LLM_MODEL:-qwen2.5:3b} && echo "Model ${LLM_MODEL:-qwen2.5:3b} is ready."'
    restart: "no"

  csc-service:
    build: ./csc-service
    image: local-llm/csc-service:latest
    container_name: local-llm-csc
    ports:
      - "8000:8000"
    restart: unless-stopped

  web-ui:
    build: ./web-ui
    image: local-llm/web-ui:latest
    container_name: local-llm-web
    depends_on:
      csc-service:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      - CSC_URL=http://csc-service:8000/correct
      - OLLAMA_URL=http://ollama:11434/api/generate
      - LLM_MODEL=${LLM_MODEL:-qwen2.5:3b}
    ports:
      - "7860:7860"
    restart: unless-stopped

volumes:
  ollama-data:
